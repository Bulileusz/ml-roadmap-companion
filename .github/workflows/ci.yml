name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv zamiast pip: w środowisku projektu nie ma ani pip, ani ensurepip,
      # więc udokumentowany setup musi być ten sam lokalnie i w CI.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements-dev.txt

      - name: Python
        run: uv python install

      - name: Instalacja zależności
        run: |
          uv venv
          uv pip install -r backend/requirements-dev.txt

      - name: Lint (ruff check)
        run: .venv/bin/ruff check .

      - name: Format (ruff format --check)
        run: .venv/bin/ruff format --check .

      - name: Testy
        run: .venv/bin/python -m pytest

      # Kontrakt HTTP i typy frontu mają być zsynchronizowane. Rozjazd oznacza,
      # że ktoś zmienił schemas.py bez `make api-types` - front skompiluje się
      # wtedy na starych typach i wywali się dopiero w przeglądarce.
      - name: Typy API są aktualne
        run: |
          cd backend && ../.venv/bin/python -c "import json; from api.main import app; \
            print(json.dumps(app.openapi(), ensure_ascii=False, indent=2))" \
            > ../frontend/openapi.json
          cd ../frontend && npx --yes openapi-typescript@7 openapi.json -o /tmp/schema.d.ts
          diff -u src/api/schema.d.ts /tmp/schema.d.ts \
            || (echo "::error::schema.d.ts nieaktualne — odpal 'make api-types'" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        run: npm ci

      - name: Typy (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Testy (vitest)
        run: npm test

      - name: Build
        run: npm run build
