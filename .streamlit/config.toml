# Motyw: ciemny, klimat terminala/edytora kodu.
#
# Zasada: co da sie wyrazic tokenem, siedzi tutaj, a nie w CSS-ie.
# Tokeny czyta front Streamlita, wiec nie rozjada sie przy aktualizacji.
# W ui/theme.py zostaje tylko to, czego tokeny nie obsluguja (wersaliki,
# gestosc, cyfry tabelaryczne) - i tam jest to opisane.
[theme]
base = "dark"
primaryColor = "#3FB950"            # terminalowa zielen - TYLKO akcje
backgroundColor = "#0D1117"         # GitHub-dark
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
linkColor = "#58A6FF"
borderColor = "#30363D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "small"
buttonRadius = "small"

font = "sans-serif"                 # body czytelny
headingFont = "monospace"           # naglowki w klimacie terminala
codeFont = "monospace"

# Gestosc zaczyna sie od rozmiaru bazowego: 15 px zamiast domyslnych 16
# zbiera cala strone, nie tykajac zadnego pojedynczego widgetu.
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.85rem"

# Domyslny h1 Streamlita ma ~2.75rem i przy monospace + wersalikach robil
# sie krzykliwy. Skala scisnieta i o wyraznych krokach, zeby h1/h2/h3 dalo
# sie rozroznic bez czytania tresci.
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

# Linki bez podkreslenia - w gestym ukladzie podkreslenia zlewaly sie
# z ramkami kontenerow. Kolor linku wystarcza do odroznienia.
linkUnderline = false

# Paleta semantyczna dla badge'ow (pudelka Leitnera, typy pytan, statusy
# materialow) i dla :green[...] w markdownie. Wartosci z palety GitHub-dark,
# zeby badge nie wypadal z motywu. Warianty tla i tekstu Streamlit dolicza
# sam - nie ustawiamy ich, bo auto-derywacja trafia lepiej niz reczne
# zgadywanie tintow na ciemnym tle.
greenColor = "#3FB950"
blueColor = "#58A6FF"
violetColor = "#BC8CFF"
orangeColor = "#D29922"
yellowColor = "#D29922"
redColor = "#F85149"
grayColor = "#8B949E"

[theme.sidebar]
backgroundColor = "#010409"         # ciemniejszy sidebar nawigacji
