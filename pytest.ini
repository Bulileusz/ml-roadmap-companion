[pytest]
# pythonpath=backend, żeby `pytest` odpalone z korzenia repo widziało pakiety
# backendu (db, repository, services, api) pod ich własnymi nazwami - tak jak
# widzi je uvicorn startujący z backend/. Bez tego każdy import w testach
# musiałby dostać prefiks "backend.".
pythonpath = backend
testpaths = backend/tests
