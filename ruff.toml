# Osobny plik zamiast pyproject.toml, żeby nie ruszać działającego pytest.ini.
line-length = 88

# Korzeń kodu źródłowego. Bez tego isort (reguła I) po przenosinach do backend/
# uznałby `db`, `repository`, `services` i `api` za paczki zewnętrzne i chciał
# przesortować importy w połowie plików - to samo miejsce, które pytest.ini
# podaje jako pythonpath.
src = ["backend"]

# Materiały do nauki w content/ to Markdown z blokami kodu, których ruff od 0.16
# potrafi dotknąć przy formatowaniu. Notatki mają zostać dokładnie tak, jak je
# napisałem - listing w nich jest treścią, nie kodem projektu.
extend-exclude = ["content", ".venv", "frontend"]

[lint]
# E/F - pycodestyle + pyflakes (baza), I - kolejność importów,
# UP - modernizacja składni pod aktualnego Pythona, B - typowe pułapki
# (bugbear, m.in. mutowalne wartości domyślne).
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Długie linie w tych dwóch plikach to treść, nie kod: DDL-e SQL trzymamy
# w jednym kawałku (łamanie CHECK-a czy CREATE INDEX psuje czytelność
# schematu), a tytuły zadań w seedzie to zdania po polsku - zawijanie ich
# konkatenacją utrudniłoby wyszukiwanie po treści.
"backend/db/schema.py" = ["E501"]
"backend/db/seed_data.py" = ["E501"]
